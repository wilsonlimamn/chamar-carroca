<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocarroça - Transporte na Ilha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 22px; color: #2c3e50; margin-bottom: 10px; }
        p { font-size: 14px; color: #666; margin-bottom: 20px; }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #1ebe5d; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .status { font-size: 13px; color: #555; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Chamar Carroça 🛒</h1>
        <p>Informe seus dados para chamar o próximo carroceiro disponível na fila.</p>

        <div class="input-group">
            <label for="destino">Para onde você vai? (Hotel / Pousada / Praia)</label>
            <input type="text" id="destino" placeholder="Ex: Pousada do Sol">
        </div>

        <div class="input-group">
            <label for="malas">Quantidade de Malas / Pessoas</label>
            <input type="text" id="malas" placeholder="Ex: 2 pessoas e 3 malas">
        </div>

        <button class="btn" id="btn-chamar" onclick="chamarProximo()" disabled>Buscando carroceiro...</button>
        <div class="status" id="status-msg">Conectando ao sistema da ilha...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zwfwmomxxdksfhoradcyx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3ZndvbXh4ZGtzZmhvcmFkY3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NjQyNDAsImV4cCI6MjEwMTM0MDI0MH0.-D2_4F3xQHJFcYtrqC1MB8KSoglmgLiJR6Dv7yZEXRA';

        let carroceiroDaVez = null;

        async function carregarProximoDaFila() {
            try {
                // Consulta direta via fetch nativo na API REST do Supabase
                const resposta = await fetch(`${SUPABASE_URL}/rest/v1/carroceiros?status=eq.disponivel&limit=1`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!resposta.ok) {
                    throw new Error('Erro na resposta do servidor');
                }

                const data = await resposta.json();

                if (data && data.length > 0) {
                    carroceiroDaVez = data[0];
                    document.getElementById('status-msg').innerText = `Próximo da fila: ${carroceiroDaVez.nome}`;
                    document.getElementById('btn-chamar').innerText = `Chamar ${carroceiroDaVez.nome} via WhatsApp`;
                    document.getElementById('btn-chamar').disabled = false;
                } else {
                    document.getElementById('status-msg').innerText = 'Nenhum carroceiro disponível no momento.';
                    document.getElementById('btn-chamar').innerText = 'Indisponível';
                    document.getElementById('btn-chamar').disabled = true;
                }
            } catch (err) {
                console.error("Erro:", err);
                document.getElementById('status-msg').innerText = 'Erro ao carregar a fila.';
            }
        }

        function chamarProximo() {
            if (!carroceiroDaVez) return;

            const destino = document.getElementById('destino').value;
            const malas = document.getElementById('malas').value;

            if (!destino) {
                alert("Por favor, informe o seu destino.");
                return;
            }

            const mensagem = `Olá, ${carroceiroDaVez.nome}! Estou no ponto/trapiche e preciso de uma carroça.%0A*Destino:* ${destino}%0A*Detalhes:* ${malas || 'Não informado'}`;
            const urlWhatsApp = `https://wa.me/${carroceiroDaVez.telefone}?text=${mensagem}`;
            window.open(urlWhatsApp, '_blank');
        }

        carregarProximoDaFila();
    </script>
</body>
</html>
